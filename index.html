<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Malawi Remit</title>
<style>
:root{--ink:#eaf6f1;--mute:#a9c5ba;--glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.15);--edge:rgba(255,255,255,.22);--field:rgba(255,255,255,.08);--green:#32d082;--red:#ff6b81;--btn:linear-gradient(135deg,#0b8a52,#07684a);--bg1:#04161b;--bg2:#093a41;--shadow:rgba(0,0,0,.35);font-family:"Avenir Next","Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:light){:root{--ink:#0f2a24;--mute:#4a6a60;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.75);--edge:rgba(255,255,255,.9);--field:rgba(255,255,255,.55);--green:#0b7a3e;--red:#c8102e;--bg1:#e3f5ec;--bg2:#bfe3f1;--shadow:rgba(20,70,60,.18)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7;animation:drift 24s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:380px;height:380px;background:#14b36b;top:-90px;left:-110px}
.orbs i:nth-child(2){width:420px;height:420px;background:#1a8fb5;bottom:-120px;right:-140px;animation-delay:-8s}
.orbs i:nth-child(3){width:220px;height:220px;background:#ff6a4a;top:46%;left:58%;opacity:.45;animation-delay:-14s}
@keyframes drift{to{transform:translate(50px,40px) scale(1.12)}}
.test{width:fit-content;max-width:calc(100% - 32px);margin:12px auto 0;padding:7px 14px;border-radius:999px;font-size:12.5px;text-align:center;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--mute)}
main{max-width:460px;margin:0 auto;padding:18px 16px 56px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#14b36b,#0a6b4a);position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.logo:before{content:"";position:absolute;left:0;right:0;top:7px;height:5px;background:#06120e}
.logo:after{content:"";position:absolute;left:10px;top:16px;width:16px;height:16px;border-radius:50%;background:#ff4d5e}
h1{font-size:20px;margin:0;letter-spacing:-.015em}
h2{font-size:22px;margin:0 0 12px;letter-spacing:-.015em}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:24px;padding:20px;margin-bottom:14px;backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:0 14px 40px var(--shadow),inset 0 1px 0 rgba(255,255,255,.28)}
@supports not (backdrop-filter:blur(1px)){.card,.test{background:#12302b}}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--edge);border-radius:14px;padding:13px 14px}
select option{color:#10231b;background:#fff}
input::placeholder{color:var(--mute);opacity:.7}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.big{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--edge);border-radius:18px;padding:8px 12px}
.big input{border:0;background:transparent;font-size:32px;font-weight:700;padding:6px 0;min-width:0;flex:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big input:focus{outline:none}.big:focus-within{outline:2px solid var(--green)}
.big .recv{flex:1;font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--green);margin:0;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.chip{font-weight:700;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge)}
.big select{width:auto;border-radius:999px;padding:8px 12px;font-weight:700;background:var(--glass2)}
.ratepill{display:inline-block;margin:14px 0 0;padding:7px 14px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge);font-size:13px;font-weight:600}
.src{font-size:12px;color:var(--mute);margin-top:12px}
.prog{display:flex;gap:6px;margin-bottom:14px}.prog i{flex:1;height:4px;border-radius:4px;background:var(--glass2)}.prog i.on{background:var(--green)}
.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--edge);font-size:15px;gap:12px}
.line:last-of-type{border:0}.line span:first-child{color:var(--mute)}.line span:last-child{text-align:right;word-break:break-word}
small{color:var(--mute)}
button{font:inherit;font-weight:600;font-size:16px;width:100%;border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:15px;background:var(--btn);color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 8px 22px rgba(7,104,74,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s}
button:active{transform:scale(.98)}
button.alt{background:var(--glass);color:var(--ink);box-shadow:none}
button:disabled{opacity:.5;cursor:not-allowed}
#out{width:auto;margin:0 0 0 auto;padding:8px 14px;font-size:13px;display:none}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.ok{width:58px;height:58px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:12px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.ok,.orbs i{animation:none}button{transition:none}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<div class="test">Early access: rates, sign-in and ID checks are live. Sending money opens soon.</div>
<main>
  <header><div class="logo"></div><h1>Malawi Remit</h1><button class="alt" id="out">Sign out</button></header>
  <div id="app"></div>
</main>
<script>
const METHODS=["Airtel Money","TNM Mpamba","Bank account (NBM, Standard, FDH, etc.)"];
const S={step:0,rates:null,amt:"",cur:"USD",method:METHODS[0],r:{name:"",country:"",bank:"",acct:"",swift:""},err:"",done:null};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=2)=>Number(n).toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});

function quote(){
  const R=S.rates,rate=R.perUnit[S.cur],amt=parseFloat(S.amt)||0;
  const fee=amt?Math.max(R.minFeeMWK,amt*R.feePct/100):0;
  const recv=amt>fee?(amt-fee)/rate:0;
  return{rate,amt,fee,recv,total:amt};
}
function validAmt(){const q=quote(),R=S.rates;
  if(!q.amt)return"Enter an amount in MWK.";
  if(q.amt<R.minSendMWK)return`Minimum transfer is MWK ${fmt(R.minSendMWK,0)}.`;
  if(q.amt>R.maxSendMWK)return`Maximum transfer is MWK ${fmt(R.maxSendMWK,0)}.`;return"";}

function view(){
  const a=$("#app");
  $("#out").style.display=S.user?"block":"none";
  $("#out").onclick=()=>{S.user=null;S.gate="login";try{localStorage.removeItem("mwuser")}catch{};view()};
  if(!S.user)return gateView();
  if(!S.user.verified){S.gate="kyc";return gateView();}
  if(!S.rates){a.innerHTML=`<div class="card"><h2>Rates unavailable</h2><div class="hint">We could not load today's rates. Check your connection and try again.</div><button id="rt">Try again</button></div>`;$("#rt").onclick=()=>{loadRates().finally(view)};return}
  if(S.step===0)a.innerHTML=stepAmount();
  if(S.step===1)a.innerHTML=stepRecipient();
  if(S.step===2)a.innerHTML=stepReview();
  bind();
}
const prog=i=>`<div class="prog">${[0,1,2].map(n=>`<i class="${n<=i?"on":""}"></i>`).join("")}</div>`;
function stepAmount(){
  const R=S.rates;
  return`${prog(0)}<div class="card">
   <label for="amt" style="margin-top:0">You send</label>
   <div class="big"><span class="chip">MWK</span><input id="amt" inputmode="decimal" placeholder="0" value="${esc(S.amt)}"></div>
   <label for="cur">They receive</label>
   <div class="big"><span class="recv" id="recv"></span><select id="cur" aria-label="Currency">${Object.keys(R.perUnit).map(c=>`<option ${c===S.cur?"selected":""}>${c}</option>`).join("")}</select></div>
   <div class="ratepill">1 ${S.cur} = MWK ${fmt(R.perUnit[S.cur])}</div>
   <div class="src">${esc(R.source)}. Rate date: ${esc(R.updated)}.${R.stale?" This is the latest rate we could get.":""}</div></div>
  <div class="card">
   <div class="line"><span>Transfer fee</span><span id="fee"></span></div>
   <label for="meth">Pay with</label><select id="meth">${METHODS.map(m=>`<option ${m===S.method?"selected":""}>${esc(m)}</option>`).join("")}</select>
   <div class="err" id="err"></div>
   <button id="next">Add recipient details</button></div>`;
}
function stepRecipient(){const r=S.r;
  return`${prog(1)}<div class="card"><h2>Who are you sending to?</h2>
  <label for="name">Full name (as on bank account)</label><input id="name" autocomplete="off" value="${esc(r.name)}">
  <label for="country">Country</label><input id="country" value="${esc(r.country)}">
  <label for="bank">Bank name</label><input id="bank" value="${esc(r.bank)}">
  <label for="acct">Account number or IBAN</label><input id="acct" autocomplete="off" value="${esc(r.acct)}">
  <label for="swift">SWIFT/BIC code</label><input id="swift" autocapitalize="characters" value="${esc(r.swift)}">
  <div class="err" id="err">${esc(S.err)}</div>
  <button id="next">Review transfer</button><button class="alt" id="back">Back</button></div>`;}
function stepReview(){const q=quote(),r=S.r;
  return`${prog(2)}<div class="card"><h2>Check and confirm</h2>
  <div class="line"><span>You send</span><span>MWK ${fmt(q.amt,0)}</span></div>
  <div class="line"><span>Bank rate</span><span>1 ${S.cur} = MWK ${fmt(q.rate)}</span></div>
  <div class="line"><span>Fee</span><span>MWK ${fmt(q.fee,0)}</span></div>
  <div class="line"><span>They receive</span><span><b>${fmt(q.recv)} ${S.cur}</b></span></div>
  <div class="line"><span>Pay with</span><span>${esc(S.method)}</span></div>
  <div class="line"><span>Recipient</span><span>${esc(r.name)}<br>${esc(r.bank)}, ${esc(r.country)}</span></div>
  <div class="line"><span>Account</span><span>${esc(r.acct)}<br>${esc(r.swift)}</span></div>
  <button disabled>Transfers open soon</button><div class="hint">Sending money is not switched on yet, so nothing is charged or sent. The rate and recipient details above are real.</div><button class="alt" id="back">Back</button></div>`;}

function upd(){const q=quote(),f=$("#fee"),r=$("#recv");if(!f)return;
  f.textContent=q.amt?`MWK ${fmt(q.fee,0)}`:"-";r.textContent=fmt(q.recv);}
function bind(){
  const n=$("#next"),b=$("#back");
  if(S.step===0){upd();
    $("#amt").oninput=e=>{S.amt=e.target.value.replace(/[^\d.]/g,"");upd();$("#err").textContent=""};
    $("#cur").onchange=e=>{S.cur=e.target.value;view()};
    $("#meth").onchange=e=>S.method=e.target.value;
    n.onclick=()=>{const m=validAmt();if(m)return $("#err").textContent=m;S.step=1;view()};
  }
  if(S.step===1){
    ["name","country","bank","acct","swift"].forEach(k=>$("#"+k).oninput=e=>S.r[k]=e.target.value.trim());
    b.onclick=()=>{S.step=0;view()};
    n.onclick=()=>{const r=S.r;
      if(!r.name||!r.country||!r.bank)return $("#err").textContent="Fill in name, country and bank.";
      if(r.acct.replace(/\s/g,"").length<6)return $("#err").textContent="Account number or IBAN looks too short.";
      if(!/^[A-Za-z]{6}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$/.test(r.swift))return $("#err").textContent="SWIFT/BIC must be 8 or 11 characters.";
      S.step=2;view()};
  }
  if(S.step===2)b.onclick=()=>{S.step=1;view()};
}
try{S.user=JSON.parse(localStorage.getItem("mwuser")||"null")}catch{}
const authH=()=>({"content-type":"application/json",...(S.user&&S.user.token?{authorization:"Bearer "+S.user.token}:{})});
const saveUser=()=>{try{localStorage.setItem("mwuser",JSON.stringify(S.user))}catch{}};
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});
function pollKyc(){
  $("#app").innerHTML=`<div class="card"><h2>Verification in progress</h2><div class="hint">Our team is checking your ID. This page updates when you are approved. You can close it and come back.</div></div>`;
  const t=()=>{if(!S.user||!S.user.pending)return;
    fetch("/api/kyc?phone="+encodeURIComponent(S.user.phone),{headers:authH()}).then(r=>r.json()).then(j=>{
      if(j.status==="approved"){S.user.verified=true;delete S.user.pending;saveUser();view()}
      else if(j.status==="rejected"||j.status==="none"){delete S.user.pending;saveUser();S.gate="kyc";view();
        $("#err").textContent=j.status==="none"?"We could not find your submission. Please submit again.":"Verification was not approved"+(j.reason?": "+j.reason:"")+". Check your details and try again."}
      else if(j.error){S.user=null;try{localStorage.removeItem("mwuser")}catch{};S.gate="login";view()}
      else setTimeout(t,5000)}).catch(()=>setTimeout(t,8000))};
  t();
}
function gateView(){
  const a=$("#app"),g=S.gate||"login";S.gate=g;
  if(g==="kyc"&&S.user&&S.user.pending)return pollKyc();
  if(g==="login")a.innerHTML=`<div class="card"><h2>Sign in</h2>
    <label for="ph">Mobile number</label><input id="ph" type="tel" inputmode="tel" placeholder="+265 99 123 4567" value="${esc(S.phone||"")}">
    <div class="err" id="err"></div><button id="go">Send code</button></div>`;
  if(g==="otp")a.innerHTML=`<div class="card"><h2>Enter your code</h2>
    <label for="cd">6-digit code sent to ${esc(S.phone)}</label><input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    
    <div class="err" id="err"></div><button id="go">Verify</button><button class="alt" id="bk">Change number</button></div>`;
  if(g==="kyc")a.innerHTML=`<div class="card"><h2>Verify your identity</h2>
    <div class="hint">Required before your first transfer. In this test, ID details stay on your device and only the last 4 digits are kept.</div>
    <label for="fn">Full legal name</label><input id="fn" autocomplete="name">
    <label for="dob">Date of birth</label><input id="dob" type="date">
    <label for="idt">ID type</label><select id="idt"><option>National ID</option><option>Passport</option><option>Driving licence</option></select>
    <label for="idn">ID number</label><input id="idn" autocomplete="off">
    <label for="adr">Home address (town or district)</label><input id="adr">
    <label for="idp">Photo of your ID</label><input id="idp" type="file" accept="image/*" capture="environment">
    <label for="sf">Selfie</label><input id="sf" type="file" accept="image/*" capture="user">
    <div class="err" id="err"></div><button id="go">Submit for verification</button></div>`;
  const err=m=>$("#err").textContent=m,go=$("#go");
  const post=b=>fetch("/api/otp",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
  if(g==="login")go.onclick=()=>{const p=$("#ph").value.replace(/[\s-]/g,"");
    if(!/^\+?\d{9,13}$/.test(p))return err("Enter a valid mobile number, e.g. +265991234567.");
    go.disabled=true;
    post({action:"send",phone:p}).then(r=>{go.disabled=false;
      if(r.status===501)return err("Sign-in is not available yet. Please try again later.");
      if(r.status===429)return err("Please wait a minute before asking for another code.");
      if(!r.ok)return r.json().catch(()=>({})).then(j=>err("Could not send the code (v2, HTTP "+r.status+(j.detail?": "+j.detail:j.error?": "+j.error:"")+")"));
      S.phone=p;S.gate="otp";view()}).catch(()=>{go.disabled=false;err("No connection. Try again.")})};
  if(g==="otp"){$("#bk").onclick=()=>{S.gate="login";view()};
    go.onclick=()=>{const c=$("#cd").value.trim();
      go.disabled=true;
      post({action:"verify",phone:S.phone,code:c}).then(r=>r.json().then(j=>({r,j}))).then(({r,j})=>{go.disabled=false;
        if(!r.ok)return err(j.error||"That code is not correct.");
        S.user={phone:S.phone,token:j.token,verified:false};saveUser();view()}).catch(()=>{go.disabled=false;err("No connection. Try again.")})}};
  if(g==="kyc")go.onclick=()=>{
    const v=id=>$("#"+id).value.trim(),age=(Date.now()-new Date(v("dob")))/31557600000;
    if(v("fn").split(/\s+/).length<2)return err("Enter your first and last name.");
    if(!v("dob")||age<18)return err("You must be 18 or older.");
    if(v("idn").length<6)return err("ID number looks too short.");
    if(!v("adr"))return err("Enter your town or district.");
    if(!$("#idp").files[0]||!$("#sf").files[0])return err("Add a photo of your ID and a selfie.");
    S.user.name=v("fn");S.user.idType=v("idt");S.user.idLast4=v("idn").slice(-4);
    const body={phone:S.user.phone,name:S.user.name,dob:v("dob"),idType:S.user.idType,idLast4:S.user.idLast4,address:v("adr")};
    $("#app").innerHTML=`<div class="card"><h2>Sending your details</h2><div class="hint">Please wait.</div></div>`;
    Promise.all([shrink($("#idp").files[0]),shrink($("#sf").files[0])])
      .then(([idImg,selfie])=>fetch("/api/kyc",{method:"POST",headers:authH(),body:JSON.stringify({...body,idImg,selfie})}))
      .then(r=>{if(r.status===501)throw"demo";if(!r.ok)throw"fail";S.user.pending=true;saveUser();pollKyc()})
      .catch(e=>{view();$("#err").textContent=e==="demo"?"ID checks are not available yet. Please try again later.":"Could not submit. Check your connection and photos, then try again."});
  };
}
function loadRates(){return fetch("/api/rates",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{S.rates=j}).catch(()=>{})}
loadRates().finally(view);
const refresh=()=>loadRates().then(()=>{const e=document.activeElement;if(S.step===0&&S.user&&S.user.verified&&!(e&&e.tagName==="INPUT"))view()});
setInterval(refresh,900000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});

</script>
</body>
</html>
