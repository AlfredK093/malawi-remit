<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6b4a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/icons/icon-192.png"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><title>Malawi Remit</title>
<style>
:root{--ink:#eaf6f1;--mute:#a9c5ba;--glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.15);--edge:rgba(255,255,255,.22);--field:rgba(255,255,255,.08);--green:#32d082;--red:#ff6b81;--btn:linear-gradient(135deg,#0b8a52,#07684a);--bg1:#04161b;--bg2:#093a41;--shadow:rgba(0,0,0,.35);font-family:"Avenir Next","Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:light){:root{--ink:#0f2a24;--mute:#4a6a60;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.75);--edge:rgba(255,255,255,.9);--field:rgba(255,255,255,.55);--green:#0b7a3e;--red:#c8102e;--bg1:#e3f5ec;--bg2:#bfe3f1;--shadow:rgba(20,70,60,.18)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7;animation:drift 24s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:380px;height:380px;background:#14b36b;top:-90px;left:-110px}
.orbs i:nth-child(2){width:420px;height:420px;background:#1a8fb5;bottom:-120px;right:-140px;animation-delay:-8s}
.orbs i:nth-child(3){width:220px;height:220px;background:#ff6a4a;top:46%;left:58%;opacity:.45;animation-delay:-14s}
@keyframes drift{to{transform:translate(50px,40px) scale(1.12)}}
.test{width:fit-content;max-width:calc(100% - 32px);margin:12px auto 0;padding:7px 14px;border-radius:999px;font-size:12.5px;text-align:center;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--mute)}
main{max-width:460px;margin:0 auto;padding:18px 16px 56px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#14b36b,#0a6b4a);position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.logo:before{content:"";position:absolute;left:0;right:0;top:7px;height:5px;background:#06120e}
.logo:after{content:"";position:absolute;left:10px;top:16px;width:16px;height:16px;border-radius:50%;background:#ff4d5e}
h1{font-size:20px;margin:0;letter-spacing:-.015em}
h2{font-size:22px;margin:0 0 12px;letter-spacing:-.015em}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:24px;padding:20px;margin-bottom:14px;backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:0 14px 40px var(--shadow),inset 0 1px 0 rgba(255,255,255,.28)}
@supports not (backdrop-filter:blur(1px)){.card,.test{background:#12302b}}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--edge);border-radius:14px;padding:13px 14px}
select option{color:#10231b;background:#fff}
input::placeholder{color:var(--mute);opacity:.7}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.big{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--edge);border-radius:18px;padding:8px 12px}
.big input{border:0;background:transparent;font-size:32px;font-weight:700;padding:6px 0;min-width:0;flex:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big input:focus{outline:none}.big:focus-within{outline:2px solid var(--green)}
.big .recv{flex:1;font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--green);margin:0;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.chip{font-weight:700;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge)}
.big select{width:auto;border-radius:999px;padding:8px 12px;font-weight:700;background:var(--glass2)}
.ratepill{display:inline-block;margin:14px 0 0;padding:7px 14px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge);font-size:13px;font-weight:600}
.src{font-size:12px;color:var(--mute);margin-top:12px}
.prog{display:flex;gap:6px;margin-bottom:14px}.prog i{flex:1;height:4px;border-radius:4px;background:var(--glass2)}.prog i.on{background:var(--green)}
.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--edge);font-size:15px;gap:12px}
.line:last-of-type{border:0}.line span:first-child{color:var(--mute)}.line span:last-child{text-align:right;word-break:break-word}
small{color:var(--mute)}
button{font:inherit;font-weight:600;font-size:16px;width:100%;border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:15px;background:var(--btn);color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 8px 22px rgba(7,104,74,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s}
button:active{transform:scale(.98)}
button.alt{background:var(--glass);color:var(--ink);box-shadow:none}
button:disabled{opacity:.5;cursor:not-allowed}
#out{width:auto;margin:0 0 0 auto;padding:8px 14px;font-size:13px;display:none}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.ok{width:58px;height:58px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:12px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.ok,.orbs i{animation:none}button{transition:none}}

.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:14px}.chk input{width:auto;margin-top:2px}
.link{background:none;border:0;box-shadow:none;width:auto;padding:6px 0;margin:0 0 10px;color:var(--mute);font-size:14px}
.pv{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-top:10px;border:1px solid var(--edge)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--glass);border-top:1px solid var(--edge);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.tabs button{margin:0;max-width:200px;padding:11px}main{padding-bottom:96px}
.big2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}.center{text-align:center}.dot{width:56px;height:56px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;font-size:26px;margin:0 auto 12px;border:1px solid var(--edge)}

header{display:flex;align-items:center;gap:10px;margin-bottom:20px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;flex:1}.brand h1{font-size:19px}
.bk{width:44px;height:44px;min-height:44px;padding:0;margin:0;border-radius:50%;font-size:20px;background:var(--glass);box-shadow:none;flex:none}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge);color:var(--mute)}
.card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:30px 20px 22px}.hero svg{filter:drop-shadow(0 14px 30px rgba(22,196,127,.5));animation:float 5s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px)}}
.hero .big2{font-size:34px;line-height:1.1;margin:16px 0 10px}.grad{background:linear-gradient(90deg,#32d082,#ff8a6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{width:auto;flex:none;margin:0;padding:10px 16px;font-size:14px;border-radius:14px}
.chip2{flex:none;padding:10px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:13px;color:var(--mute)}.chip2 b{display:block;color:var(--ink);font-size:15px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feat div{background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:14px 8px;text-align:center;font-size:12px;color:var(--mute);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.feat b{display:block;font-size:14px;color:var(--ink);margin-bottom:3px}
.grn{color:var(--green);font-weight:700}
input,select{min-height:52px}button{min-height:54px}
@media(prefers-reduced-motion:reduce){.card,.hero svg{animation:none}}
a{color:var(--green)}.priv h3{font-size:15px;margin:16px 0 4px}.priv h3:first-child{margin-top:0}.priv p{margin:0;font-size:14px;color:var(--mute);line-height:1.55}
.tabs button{max-width:140px}.lnk{display:block;text-align:center;margin-top:14px;font-size:14px}
[hidden]{display:none!important}
#off{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;text-align:center;font-size:13px;background:#b3261e;color:#fff}
</style></head><body>
<div class="orbs"><i></i><i></i><i></i></div>
<div id="off" hidden>You are offline. Rates and sign-in need a connection.</div><main><header id="hd"></header><div id="app"></div></main>
<div id="tabs" class="tabs" hidden><button data-a="tab" data-t="send">Send</button><button class="alt" data-a="tab" data-t="act">Activity</button><button class="alt" data-a="tab" data-t="acct">Account</button></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=(n,d=2)=>Number(n).toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
const LOGO=n=>`<svg width="${n}" height="${n}" viewBox="0 0 64 64" aria-label="Malawi Remit"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18c985"/><stop offset="1" stop-color="#095c6b"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><rect width="64" height="64" rx="16" fill="url(#hl)"/><circle cx="22" cy="12" r="5" fill="#ff4d5e"/><path d="M13 49V23L29 41L48 19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 19H48V30" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const METHODS=["Airtel Money","TNM Mpamba","Bank account"];
const S={v:"boot",rates:null,user:null,tab:"send",step:0,wiz:1,mode:"in",note:"",
 q:{amt:"",cur:"USD",method:METHODS[0]},r:{name:"",country:"",bank:"",acct:"",swift:""},
 k:{ag:false,fn:"",dob:"",adr:"",idt:"National ID",idn:"",idImg:"",selfie:""},cfg:{},a:{ts:"",ph:"",ag:false,code:"",phone:"",cool:0}};
try{S.user=JSON.parse(localStorage.getItem("mwuser")||"null")}catch{}
if(S.user&&!S.user.token)S.user=null;
const save=()=>{try{S.user?localStorage.setItem("mwuser",JSON.stringify(S.user)):localStorage.removeItem("mwuser")}catch{}};
const api=(p,o={})=>fetch(p,{method:o.method||"GET",cache:"no-store",headers:{"content-type":"application/json",...(S.user?{authorization:"Bearer "+S.user.token}:{})},body:o.body?JSON.stringify(o.body):undefined});
const fail=m=>{const e=$("#err");if(e)e.textContent=m};
const busy=on=>{const b=$("#go");if(b)b.disabled=on};
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});

function loadTx(){api("/api/transfers").then(r=>r.json()).then(j=>{S.tx=Array.isArray(j)?j:[]}).catch(()=>{S.tx=[]}).finally(()=>{if(S.v==="home"&&S.tab==="act")render()})}
const loadCfg=()=>fetch("/api/config").then(r=>r.json()).then(j=>{S.cfg=j}).catch(()=>{});
function mountTs(){const el=$("#ts");if(!el||!S.cfg.turnstile)return;
  const go=()=>{try{S.a.ts="";S.tsId=turnstile.render("#ts",{sitekey:S.cfg.turnstile,theme:"auto",callback:t=>{S.a.ts=t},"expired-callback":()=>{S.a.ts=""}})}catch{}};
  if(window.turnstile)go();else if(!document.getElementById("tsjs")){const s=document.createElement("script");s.id="tsjs";s.async=true;s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";s.onload=go;document.head.appendChild(s)}else setTimeout(mountTs,300)}
function loadRates(){return fetch("/api/rates",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{S.rates=j}).catch(()=>{})}
async function sync(){if(!S.user)return;
  try{const r=await api("/api/kyc");if(r.status===401){S.user=null;save();S.note="Your session expired. Please sign in again.";return}
    const j=await r.json();S.user.status=j.status;S.user.name=j.name||S.user.name;S.user.reason=j.reason||"";save()}catch{}}
function route(){if(!S.user){if(!["auth","otp"].includes(S.v))S.v="welcome";return}
  const s=S.user.status;S.v=s==="approved"?"home":s==="pending"?"pending":"kyc";if(S.v==="kyc"){S.wiz=1;S.k.ag=S.k.ag||S.a.ag}}
function signOut(n){if(S.user)api("/api/logout",{method:"POST"}).catch(()=>{});S.user=null;save();S.note=n||"";S.v="welcome";render()}

const quote=()=>{const R=S.rates,a=parseFloat(S.q.amt)||0,rate=R.perUnit[S.q.cur],fee=a?Math.max(R.minFeeMWK,a*R.feePct/100):0;return{a,rate,fee,recv:a>fee?(a-fee)/rate:0}};
const amtErr=()=>{const q=quote(),R=S.rates;return!q.a?"Enter an amount in MWK.":q.a<R.minSendMWK?`Minimum transfer is MWK ${fmt(R.minSendMWK,0)}.`:q.a>R.maxSendMWK?`Maximum transfer is MWK ${fmt(R.maxSendMWK,0)}.`:""};
const prog=(i,n=3)=>`<div class="prog">${Array.from({length:n},(_,x)=>`<i class="${x<i?"on":""}"></i>`).join("")}</div>`;
const field=(l,id,s,extra="")=>`<label for="${id}">${l}</label><input id="${id}" data-s="${s}" ${extra} value="${esc(s.split(".").reduce((o,k)=>o[k],S))}">`;
const upload=(l,key,cap)=>`<label>${l}</label><input type="file" accept="image/*" capture="${cap}" data-f="${key}">${S.k[key]?`<img class="pv" src="${S.k[key]}" alt="">`:""}`;

const V={
 boot:()=>`<div class="card center"><h2>Loading</h2></div>`,
 welcome:()=>{const R=S.rates;let ex="";
  if(R){const a=500000,fee=Math.max(R.minFeeMWK,a*R.feePct/100);ex=`<div class="card"><div class="src" style="margin:0 0 6px">EXAMPLE AT TODAY'S BANK RATE</div><div class="line"><span>You send</span><span>MWK ${fmt(a,0)}</span></div><div class="line"><span>Fee</span><span>MWK ${fmt(fee,0)}</span></div><div class="line"><span>They receive</span><span class="grn">${fmt((a-fee)/R.perUnit.USD)} USD</span></div></div>`}
  return`<div class="card hero">${LOGO(88)}<div class="big2">Your kwacha, <span class="grad">anywhere</span>.</div><div class="hint" style="font-size:15px;margin:0 0 8px">Send money abroad at the real Reserve Bank of Malawi rate. No hidden markups.</div><button data-a="go" data-m="up">Get started</button><button class="alt" data-a="go" data-m="in">I have an account</button><div class="err">${esc(S.note)}</div></div>
  ${R?`<div class="chips">${Object.keys(R.perUnit).map(c=>`<div class="chip2"><b>${c}</b>MWK ${fmt(R.perUnit[c])}</div>`).join("")}</div>`:""}${ex}
  <div class="feat"><div><b>Bank rate</b>No markup</div><div><b>Clear fees</b>${R?`${R.feePct}%, min MWK ${fmt(R.minFeeMWK,0)}`:"Shown first"}</div><div><b>Verified</b>ID checked</div></div><a href="#" data-a="priv" class="lnk">Privacy notice</a>`},
 auth:()=>{const up=S.mode==="up";return`<div class="card"><h2>${up?"Create your account":"Welcome back"}</h2><div class="hint" style="margin:0">We will text you a 6-digit code.</div>${field("Mobile number","ph","a.ph",'type="tel" inputmode="tel" placeholder="+265 99 123 4567"')}${up?`<label class="chk"><input type="checkbox" data-s="a.ag" ${S.a.ag?"checked":""}> I have read the <a href="#" data-a="priv">Privacy notice</a> and agree to my details being used to verify my identity and provide this service.</label>`:""}<div id="ts" style="margin-top:14px"></div><div class="err" id="err">${esc(S.note)}</div><button id="go" data-a="send">Send code</button><button class="alt" data-a="swap">${up?"I already have an account":"Create a new account"}</button></div>`},
 otp:()=>`<div class="card"><h2>Enter your code</h2><div class="hint" style="margin:0">Sent to ${esc(S.a.phone)}</div>${field("6-digit code","cd","a.code",'inputmode="numeric" maxlength="6" autocomplete="one-time-code"')}<div class="err" id="err"></div><button id="go" data-a="verify">Verify</button><button class="alt" id="rs" data-a="resend">Resend code</button></div>`,
 kyc:()=>{const k=S.k,w=S.wiz,note=S.user.status==="rejected"?`<div class="err">Your last check was not approved${S.user.reason?": "+esc(S.user.reason):""}. Please check your details and submit again.</div>`:"";
  const body=w===1?`${field("Full legal name","fn","k.fn",'autocomplete="name"')}${field("Date of birth","dob","k.dob",'type="date"')}${field("Home address (town or district)","adr","k.adr")}<label class="chk"><input type="checkbox" data-s="k.ag" ${k.ag?"checked":""}> I have read the <a href="#" data-a="priv">Privacy notice</a> and agree to my details being used to verify my identity.</label>`
   :w===2?`<label for="idt">ID type</label><select id="idt" data-s="k.idt">${["National ID","Passport","Driving licence"].map(x=>`<option ${x===k.idt?"selected":""}>${x}</option>`).join("")}</select>${field("ID number","idn","k.idn",'autocomplete="off"')}${upload("Photo of your ID","idImg","environment")}`
   :`${upload("Selfie","selfie","user")}<div class="line" style="margin-top:12px"><span>Name</span><span>${esc(k.fn)}</span></div><div class="line"><span>ID</span><span>${esc(k.idt)} ending ${esc(k.idn.slice(-4))}</span></div>`;
  return`${prog(w)}<div class="card"><h2>${["","Your details","Your ID","Take a selfie"][w]}</h2><div class="hint" style="margin:0">Step ${w} of 3. Only our verification team sees your photos, and they are deleted once reviewed.</div>${note}${body}<div class="err" id="err"></div><button id="go" data-a="next">${w===3?"Submit for review":"Continue"}</button>${w>1?`<button class="alt" data-a="prev">Back</button>`:`<button class="alt" data-a="out">Sign out</button>`}</div>`},
 pending:()=>`<div class="card center"><div class="dot">&#8987;</div><h2>We are reviewing your ID</h2><div class="hint">You can close this page. Sign in again any time to see your result. This screen updates by itself.</div><button class="alt" data-a="check">Check now</button><button class="alt" data-a="out">Sign out</button></div>`,
 home:()=>S.tab==="acct"?V.acct():S.tab==="act"?V.act():[V.amount,V.recip,V.review][S.step](),
 act:()=>{const t=S.tx,h=`<div class="big2" style="font-size:24px;margin:0 0 12px">Activity</div>`;
  if(!t)return h+`<div class="card center"><div class="hint">Loading</div></div>`;
  if(!t.length)return h+`<div class="card center"><div class="dot">&#8599;</div><h2>No transfers yet</h2><div class="hint">Sending money opens soon. Your transfers will appear here with their status and receipt.</div><button data-a="tab" data-t="send">See today's rate</button></div>`;
  return h+`<div class="card">${t.map(x=>`<div class="line"><span>${esc(x.name)}<br><small>${esc(x.date)} - ${esc(x.ref)}</small></span><span>${fmt(x.recv)} ${esc(x.cur)}<br><small>${esc(x.status)}</small></span></div>`).join("")}</div>`},
 help:()=>{const e=S.rates&&S.rates.supportEmail,R=S.rates;return`<div class="big2" style="font-size:24px;margin:0 0 12px">Help and contact</div><div class="card priv"><h3>Why do I need to verify my ID?</h3><p>We check who you are before you can send money, to keep your account and your money safe.</p><h3>How is the rate set?</h3><p>We use the Reserve Bank of Malawi's published daily rate with no markup from us.</p><h3>What does it cost?</h3><p>${R?`A fee of ${R.feePct}% of the amount, with a minimum of MWK ${fmt(R.minFeeMWK,0)}. You always see the fee before you decide.`:"You always see the fee before you decide."}</p><h3>When can I send money?</h3><p>Sending is not open yet. Your account and ID check are ready, so you can send as soon as it opens.</p><h3>Need a person?</h3><p>${e?"Email "+esc(e)+".":"Contact the team that invited you to the app."}</p></div>`},
 privacy:()=>{const e=S.rates&&S.rates.supportEmail;return`<div class="big2" style="font-size:24px;margin:0 0 12px">Privacy notice</div><div class="card priv"><h3>What we collect</h3><p>Your mobile number; your name, date of birth and home address; your ID type and the last 4 digits of your ID number; a photo of your ID and a selfie.</p><h3>Why</h3><p>To confirm who you are before you can send money, to keep your account secure and to run the service.</p><h3>Who sees it</h3><p>Only our verification team sees your ID photo and selfie. Your sign-in code is sent by SMS through Africa's Talking, and we text you when your ID is approved or rejected. Your data is stored with Cloudflare, whose security check also helps keep bots out of sign-up. We do not sell your data.</p><h3>How long</h3><p>ID photos and selfies are deleted as soon as we approve or reject your check. Your other details are kept while you have an account.</p><h3>Your choices</h3><p>You can delete your account and data at any time from the Account tab. ${e?"Questions: "+esc(e)+".":"Contact our support team with any questions."}</p></div>`},
 acct:()=>`<div class="card center"><div class="dot">${esc((S.user.name||"?")[0])}</div><h2>${esc(S.user.name||"Your account")}</h2><div class="line"><span>Phone</span><span>${esc(S.user.phone)}</span></div><div class="line"><span>ID check</span><span>Verified</span></div><button class="alt" data-a="help">Help and contact</button><button class="alt" data-a="priv">Privacy notice</button><button class="alt" data-a="out">Sign out</button><button class="alt" data-a="del" style="color:var(--red)">Delete my account and data</button></div>`,
 amount:()=>{const R=S.rates;if(!R)return`<div class="card"><h2>Rates unavailable</h2><div class="hint">We could not load today's rates.</div><button data-a="rates">Try again</button></div>`;
  return`<div class="big2" style="font-size:24px;margin:0 0 12px">Hello, ${esc((S.user.name||"there").split(" ")[0])}</div><div class="chips">${Object.keys(R.perUnit).map(c=>`<button class="${c===S.q.cur?"":"alt"}" data-a="cur" data-c="${c}">${c}</button>`).join("")}</div>${prog(1)}<div class="card"><label style="margin-top:0">You send</label><div class="big"><span class="chip">MWK</span><input id="amt" data-s="q.amt" inputmode="decimal" placeholder="0" value="${esc(S.q.amt)}"></div><label>They receive</label><div class="big"><span class="recv" id="recv"></span><select id="cur" data-s="q.cur">${Object.keys(R.perUnit).map(c=>`<option ${c===S.q.cur?"selected":""}>${c}</option>`).join("")}</select></div><div class="ratepill">1 ${S.q.cur} = MWK ${fmt(R.perUnit[S.q.cur])}</div><div class="src">${esc(R.source)}. Rate date: ${esc(R.updated)}.${R.stale?" Latest rate we could get.":""}</div></div>
  <div class="card"><div class="line"><span>Transfer fee</span><span id="fee"></span></div><div class="hint" id="feenote" style="margin-top:0"></div><label>Pay with</label><select data-s="q.method">${METHODS.map(m=>`<option ${m===S.q.method?"selected":""}>${m}</option>`).join("")}</select><div class="err" id="err"></div><button data-a="toR">Add recipient</button></div>`},
 recip:()=>`${prog(2)}<div class="card"><h2>Who are you sending to?</h2>${field("Full name (as on bank account)","rn","r.name")}${field("Country","rc","r.country")}${field("Bank name","rb","r.bank")}${field("Account number or IBAN","ra","r.acct",'autocomplete="off"')}${field("SWIFT/BIC code","rs2","r.swift",'autocapitalize="characters"')}<div class="err" id="err"></div><button data-a="toV">Review</button><button class="alt" data-a="s0">Back</button></div>`,
 review:()=>{const q=quote(),r=S.r;return`${prog(3)}<div class="card"><h2>Review</h2><div class="line"><span>You send</span><span>MWK ${fmt(q.a,0)}</span></div><div class="line"><span>Bank rate</span><span>1 ${S.q.cur} = MWK ${fmt(q.rate)}</span></div><div class="line"><span>Fee (${S.rates.feePct}%, min MWK ${fmt(S.rates.minFeeMWK,0)})</span><span>MWK ${fmt(q.fee,0)}</span></div><div class="line"><span>They receive</span><span><b>${fmt(q.recv)} ${S.q.cur}</b></span></div><div class="line"><span>Recipient</span><span>${esc(r.name)}<br>${esc(r.bank)}, ${esc(r.country)}</span></div><button disabled>Transfers open soon</button><div class="hint">Sending money is not switched on yet, so nothing is charged or sent.</div><button class="alt" data-a="s1">Back</button></div>`}
};
function upd(){if(!$("#fee")||!S.rates)return;const q=quote();$("#fee").textContent=q.a?`MWK ${fmt(q.fee,0)}`:"-";$("#recv").textContent=fmt(q.recv);const R=S.rates;$("#feenote").textContent=`Fee is ${R.feePct}% of the amount, with a minimum of MWK ${fmt(R.minFeeMWK,0)}.${q.a&&q.a*R.feePct/100<R.minFeeMWK?" The minimum fee applies to this amount.":""} You can send MWK ${fmt(R.minSendMWK,0)} to MWK ${fmt(R.maxSendMWK,0)}.`}

  const t=$("#tabs");t.hidden=S.v!=="home";if(!t.hidden)t.querySelectorAll("button").forEach(b=>b.className=b.dataset.t===S.tab?"":"alt");

const A={
 go:b=>{S.mode=b.dataset.m;S.note="";S.v="auth";render()},swap:()=>{S.mode=S.mode==="up"?"in":"up";S.note="";render()},

 send:async(x)=>{const skip=x===true;const p=S.a.ph.replace(/[\s-]/g,"");
  if(!/^\+?\d{9,13}$/.test(p))return fail("Enter a valid mobile number, e.g. +265991234567.");

  if(S.cfg.turnstile&&!S.a.ts&&!skip)return fail("Please complete the security check.");
  busy(1);const r=await api("/api/otp",{method:"POST",body:{action:"send",phone:p,turnstile:S.a.ts}}).catch(()=>null);busy(0);
  if(!r)return fail("No connection. Try again.");if(r.status===429)return fail("Please wait a minute before asking for another code.");
  if(!r.ok){if(window.turnstile&&S.tsId!=null){try{turnstile.reset(S.tsId)}catch{}S.a.ts=""}const j=await r.json().catch(()=>({}));return fail("Could not send the code"+(j.detail?" ("+j.detail+")":" (HTTP "+r.status+")")+".")}
  S.a.phone=p;S.a.cool=Date.now()+60000;S.a.code="";S.note="";S.v="otp";render()},
 resend:()=>{S.a.ph=S.a.phone;A.send(true).then(()=>{S.v="otp";render()})},
 verify:async()=>{const c=S.a.code.trim();if(c.length!==6)return fail("Enter the 6-digit code.");busy(1);
  const r=await api("/api/otp",{method:"POST",body:{action:"verify",phone:S.a.phone,code:c}}).catch(()=>null);busy(0);
  if(!r)return fail("No connection. Try again.");const j=await r.json().catch(()=>({}));if(!r.ok)return fail(j.error||"That code is not correct.");
  S.user={phone:S.a.phone,token:j.token,status:"none"};save();await sync();S.a.code="";route();render()},
 next:async()=>{const k=S.k,w=S.wiz;
  if(w===1){if(k.fn.trim().split(/\s+/).length<2)return fail("Enter your first and last name.");if(!k.dob||(Date.now()-new Date(k.dob))/31557600000<18)return fail("You must be 18 or older.");if(!k.adr.trim())return fail("Enter your town or district.");if(!k.ag)return fail("Please accept the privacy notice to continue.")}

  if(w<3){S.wiz++;return render()}
  if(!k.selfie)return fail("Add a selfie.");busy(1);fail("Sending your details...");
  const r=await api("/api/kyc",{method:"POST",body:{name:k.fn.trim(),dob:k.dob,idType:k.idt,idLast4:k.idn.trim().slice(-4),address:k.adr.trim(),idImg:k.idImg,selfie:k.selfie,consent:true}}).catch(()=>null);busy(0);
  if(!r)return fail("No connection. Try again.");if(r.status===401)return signOut("Your session expired. Please sign in again.");
  if(!r.ok){const j=await r.json().catch(()=>({}));return fail("Could not submit (HTTP "+r.status+(j.detail?", "+j.detail:"")+").")}
  S.user.status="pending";S.user.name=k.fn.trim();save();S.k.idImg=S.k.selfie="";route();render()},
 prev:()=>{S.wiz--;render()},out:()=>signOut(),check:async()=>{await sync();route();render()},rates:async()=>{await loadRates();render()},
 tab:b=>{S.tab=b.dataset.t;S.step=0;if(S.tab==="act"){S.tx=null;loadTx()}render()},

 priv:()=>{S.prev=S.v;S.v="privacy";render()},
 del:async()=>{if(!confirm("Delete your account and all your data? This cannot be undone."))return;const r=await api("/api/kyc",{method:"DELETE"}).catch(()=>null);r&&r.ok?signOut("Your account and data were deleted."):alert("Could not delete your account. Try again.")},
 toR:()=>{const m=amtErr();if(m)return fail(m);S.step=1;render()},
 toV:()=>{const r=S.r;if(!r.name||!r.country||!r.bank)return fail("Fill in name, country and bank.");if(r.acct.replace(/\s/g,"").length<6)return fail("Account number or IBAN looks too short.");if(!/^[A-Za-z]{6}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$/.test(r.swift))return fail("SWIFT/BIC must be 8 or 11 characters.");S.step=2;render()},
 cur:b=>{S.q.cur=b.dataset.c;render()},hback:()=>goBack(),s0:()=>{S.step=0;render()},s1:()=>{S.step=1;render()}
};
