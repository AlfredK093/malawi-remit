<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a3e">
<link rel="manifest" href="manifest.json">
<title>Malawi Remit</title>
<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#10231b;--mute:#5b6e65;--line:#d3ddd7;--green:#0b7a3e;--red:#c8102e;--warn:#fff3c4;--warnink:#5a4500;font-family:"Avenir Next","Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a14;--card:#14251d;--ink:#e8f1ec;--mute:#93a79c;--line:#27402f;--green:#2fb36a;--red:#ff5a73;--warn:#3a3210;--warnink:#f3dd8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.test{background:var(--warn);color:var(--warnink);font-size:13px;padding:8px 16px;text-align:center}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--green);position:relative;overflow:hidden}
.logo:before{content:"";position:absolute;left:0;right:0;top:6px;height:5px;background:#10231b}
.logo:after{content:"";position:absolute;left:9px;top:15px;width:16px;height:16px;border-radius:50%;background:var(--red)}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1}
.rate{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.rate small{font-size:14px;font-weight:500;color:var(--mute);display:block;margin-top:6px;letter-spacing:0}
.recv{font-size:30px;font-weight:700;color:var(--green);margin:2px 0}
.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
.line:last-child{border:0}.line span:first-child{color:var(--mute)}.line span:last-child{text-align:right;word-break:break-word}
button{font:inherit;font-weight:600;font-size:16px;width:100%;border:0;border-radius:12px;padding:14px;background:var(--green);color:#fff;cursor:pointer;margin-top:10px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.hist{font-size:14px}.hist .line{padding:8px 0}
.ok{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:10px;animation:pop .35s ease-out}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
#out{width:auto;margin:0 0 0 auto;padding:8px 12px;font-size:13px;display:none}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.ok{animation:none}}
</style>
</head>
<body>
<div class="test">Test phase: transfers here are simulated. No real money moves.</div>
<main>
  <header><div class="logo"></div><h1>Malawi Remit</h1><button class="alt" id="out">Sign out</button></header>
  <div id="app"></div>
</main>
<script>
const FALLBACK={updated:"n/a",source:"Built-in sample rates",perUnit:{USD:1751,GBP:2300,EUR:2030,ZAR:98},feePct:1,minFeeMWK:2000,minSendMWK:20000,maxSendMWK:5000000};
const METHODS=["Airtel Money","TNM Mpamba","Bank account (NBM, Standard, FDH, etc.)"];
const S={step:0,rates:FALLBACK,amt:"",cur:"USD",method:METHODS[0],r:{name:"",country:"",bank:"",acct:"",swift:""},err:"",done:null};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=2)=>Number(n).toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
const hist=()=>{try{return JSON.parse(localStorage.getItem("mwremit")||"[]")}catch{return[]}};
const save=h=>{try{localStorage.setItem("mwremit",JSON.stringify(h.slice(0,20)))}catch{}};

function quote(){
  const R=S.rates,rate=R.perUnit[S.cur],amt=parseFloat(S.amt)||0;
  const fee=amt?Math.max(R.minFeeMWK,amt*R.feePct/100):0;
  const recv=amt>fee?(amt-fee)/rate:0;
  return{rate,amt,fee,recv,total:amt};
}
function validAmt(){const q=quote(),R=S.rates;
  if(!q.amt)return"Enter an amount in MWK.";
  if(q.amt<R.minSendMWK)return`Minimum transfer is MWK ${fmt(R.minSendMWK,0)}.`;
  if(q.amt>R.maxSendMWK)return`Maximum transfer is MWK ${fmt(R.maxSendMWK,0)}.`;return"";}

function view(){
  const a=$("#app");
  $("#out").style.display=S.user?"block":"none";
  $("#out").onclick=()=>{S.user=null;S.gate="login";try{localStorage.removeItem("mwuser")}catch{};view()};
  if(!S.user)return gateView();
  if(!S.user.verified){S.gate="kyc";return gateView();}
  if(S.step===0)a.innerHTML=stepAmount();
  if(S.step===1)a.innerHTML=stepRecipient();
  if(S.step===2)a.innerHTML=stepReview();
  if(S.step===3)a.innerHTML=stepDone();
  bind();
}
function stepAmount(){
  const R=S.rates,h=hist();
  return`<div class="card">
   <div class="rate">1 ${S.cur} = MWK ${fmt(R.perUnit[S.cur])}<small>${esc(R.source)}. Updated ${esc(R.updated)}.</small></div></div>
  <div class="card"><h2>Send money abroad</h2>
   <label for="amt">You send (MWK)</label><input id="amt" inputmode="decimal" placeholder="e.g. 500000" value="${esc(S.amt)}">
   <label for="cur">Recipient gets</label><select id="cur">${Object.keys(R.perUnit).map(c=>`<option ${c===S.cur?"selected":""}>${c}</option>`).join("")}</select>
   <div class="line" style="margin-top:12px"><span>Transfer fee</span><span id="fee"></span></div>
   <div class="line"><span>They receive</span><span class="recv" id="recv"></span></div>
   <label for="meth">Pay with</label><select id="meth">${METHODS.map(m=>`<option ${m===S.method?"selected":""}>${esc(m)}</option>`).join("")}</select>
   <div class="err" id="err"></div>
   <button id="next">Add recipient details</button></div>
  ${h.length?`<div class="card hist"><h2 style="font-size:17px">Recent test transfers</h2>${h.slice(0,5).map(t=>`<div class="line"><span>${esc(t.name)}<br><small>${esc(t.date)}</small></span><span>${fmt(t.recv)} ${esc(t.cur)}<br><small>${esc(t.ref)}</small></span></div>`).join("")}</div>`:""}`;
}
function stepRecipient(){const r=S.r;
  return`<div class="card"><h2>Who are you sending to?</h2>
  <label for="name">Full name (as on bank account)</label><input id="name" autocomplete="off" value="${esc(r.name)}">
  <label for="country">Country</label><input id="country" value="${esc(r.country)}">
  <label for="bank">Bank name</label><input id="bank" value="${esc(r.bank)}">
  <label for="acct">Account number or IBAN</label><input id="acct" autocomplete="off" value="${esc(r.acct)}">
  <label for="swift">SWIFT/BIC code</label><input id="swift" autocapitalize="characters" value="${esc(r.swift)}">
  <div class="err" id="err">${esc(S.err)}</div>
  <button id="next">Review transfer</button><button class="alt" id="back">Back</button></div>`;}
function stepReview(){const q=quote(),r=S.r;
  return`<div class="card"><h2>Check and confirm</h2>
  <div class="line"><span>You send</span><span>MWK ${fmt(q.amt,0)}</span></div>
  <div class="line"><span>Bank rate</span><span>1 ${S.cur} = MWK ${fmt(q.rate)}</span></div>
  <div class="line"><span>Fee</span><span>MWK ${fmt(q.fee,0)}</span></div>
  <div class="line"><span>They receive</span><span><b>${fmt(q.recv)} ${S.cur}</b></span></div>
  <div class="line"><span>Pay with</span><span>${esc(S.method)}</span></div>
  <div class="line"><span>Recipient</span><span>${esc(r.name)}<br>${esc(r.bank)}, ${esc(r.country)}</span></div>
  <div class="line"><span>Account</span><span>${esc(r.acct)}<br>${esc(r.swift)}</span></div>
  <button id="next">Confirm test transfer</button><button class="alt" id="back">Back</button></div>`;}
function stepDone(){const d=S.done;
  return`<div class="card"><div class="ok">&#10003;</div><h2>Test transfer recorded</h2>
  <div class="line"><span>Reference</span><span>${esc(d.ref)}</span></div>
  <div class="line"><span>Recipient</span><span>${esc(d.name)}</span></div>
  <div class="line"><span>Amount</span><span>${fmt(d.recv)} ${esc(d.cur)}</span></div>
  <div class="line"><span>Status</span><span>Simulated, no funds moved</span></div>
  <button id="next">Send another</button></div>`;}

function upd(){const q=quote(),f=$("#fee"),r=$("#recv");if(!f)return;
  f.textContent=q.amt?`MWK ${fmt(q.fee,0)}`:"-";r.textContent=`${fmt(q.recv)} ${S.cur}`;}
function bind(){
  const n=$("#next"),b=$("#back");
  if(S.step===0){upd();
    $("#amt").oninput=e=>{S.amt=e.target.value.replace(/[^\d.]/g,"");upd();$("#err").textContent=""};
    $("#cur").onchange=e=>{S.cur=e.target.value;view()};
    $("#meth").onchange=e=>S.method=e.target.value;
    n.onclick=()=>{const m=validAmt();if(m)return $("#err").textContent=m;S.step=1;view()};
  }
  if(S.step===1){
    ["name","country","bank","acct","swift"].forEach(k=>$("#"+k).oninput=e=>S.r[k]=e.target.value.trim());
    b.onclick=()=>{S.step=0;view()};
    n.onclick=()=>{const r=S.r;
      if(!r.name||!r.country||!r.bank)return $("#err").textContent="Fill in name, country and bank.";
      if(r.acct.replace(/\s/g,"").length<6)return $("#err").textContent="Account number or IBAN looks too short.";
      if(!/^[A-Za-z]{6}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$/.test(r.swift))return $("#err").textContent="SWIFT/BIC must be 8 or 11 characters.";
      S.step=2;view()};
  }
  if(S.step===2){b.onclick=()=>{S.step=1;view()};
    n.onclick=()=>{const q=quote();
      S.done={ref:"MW"+Date.now().toString(36).toUpperCase(),name:S.r.name,recv:q.recv,cur:S.cur,date:new Date().toLocaleString("en-GB")};
      const h=hist();h.unshift(S.done);save(h);S.step=3;view()};}
  if(S.step===3)n.onclick=()=>{S.amt="";S.r={name:"",country:"",bank:"",acct:"",swift:""};S.step=0;view()};
}
try{S.user=JSON.parse(localStorage.getItem("mwuser")||"null")}catch{}
const saveUser=()=>{try{localStorage.setItem("mwuser",JSON.stringify(S.user))}catch{}};
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});
function pollKyc(){
  $("#app").innerHTML=`<div class="card"><h2>Verification in progress</h2><div class="hint">Our team is checking your ID. This page updates when you are approved. You can close it and come back.</div></div>`;
  const t=()=>{if(!S.user||!S.user.pending)return;
    fetch("/api/kyc?phone="+encodeURIComponent(S.user.phone)).then(r=>r.json()).then(j=>{
      if(j.status==="approved"){S.user.verified=true;delete S.user.pending;saveUser();view()}
      else if(j.status==="rejected"||j.status==="none"){delete S.user.pending;saveUser();S.gate="kyc";view();
        $("#err").textContent=j.status==="none"?"We could not find your submission. Please submit again.":"Verification was not approved"+(j.reason?": "+j.reason:"")+". Check your details and try again."}
      else setTimeout(t,5000)}).catch(()=>setTimeout(t,8000))};
  t();
}
function gateView(){
  const a=$("#app"),g=S.gate||"login";S.gate=g;
  if(g==="kyc"&&S.user&&S.user.pending)return pollKyc();
  if(g==="login")a.innerHTML=`<div class="card"><h2>Sign in</h2>
    <label for="ph">Mobile number</label><input id="ph" type="tel" inputmode="tel" placeholder="+265 99 123 4567" value="${esc(S.phone||"")}">
    <div class="err" id="err"></div><button id="go">Send code</button></div>`;
  if(g==="otp")a.innerHTML=`<div class="card"><h2>Enter your code</h2>
    <label for="cd">6-digit code sent to ${esc(S.phone)}</label><input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <div class="hint">Test phase: use code 123456.</div>
    <div class="err" id="err"></div><button id="go">Verify</button><button class="alt" id="bk">Change number</button></div>`;
  if(g==="kyc")a.innerHTML=`<div class="card"><h2>Verify your identity</h2>
    <div class="hint">Required before your first transfer. In this test, ID details stay on your device and only the last 4 digits are kept.</div>
    <label for="fn">Full legal name</label><input id="fn" autocomplete="name">
    <label for="dob">Date of birth</label><input id="dob" type="date">
    <label for="idt">ID type</label><select id="idt"><option>National ID</option><option>Passport</option><option>Driving licence</option></select>
    <label for="idn">ID number</label><input id="idn" autocomplete="off">
    <label for="adr">Home address (town or district)</label><input id="adr">
    <label for="idp">Photo of your ID</label><input id="idp" type="file" accept="image/*" capture="environment">
    <label for="sf">Selfie</label><input id="sf" type="file" accept="image/*" capture="user">
    <div class="err" id="err"></div><button id="go">Submit for verification</button></div>`;
  const err=m=>$("#err").textContent=m,go=$("#go");
  if(g==="login")go.onclick=()=>{const p=$("#ph").value.replace(/[\s-]/g,"");
    if(!/^\+?\d{9,13}$/.test(p))return err("Enter a valid mobile number, e.g. +265991234567.");
    S.phone=p;S.gate="otp";view()};
  if(g==="otp"){$("#bk").onclick=()=>{S.gate="login";view()};
    go.onclick=()=>{if($("#cd").value!=="123456")return err("That code is not correct. Try 123456.");
      S.user={phone:S.phone,verified:false};saveUser();view()}};
  if(g==="kyc")go.onclick=()=>{
    const v=id=>$("#"+id).value.trim(),age=(Date.now()-new Date(v("dob")))/31557600000;
    if(v("fn").split(/\s+/).length<2)return err("Enter your first and last name.");
    if(!v("dob")||age<18)return err("You must be 18 or older.");
    if(v("idn").length<6)return err("ID number looks too short.");
    if(!v("adr"))return err("Enter your town or district.");
    if(!$("#idp").files[0]||!$("#sf").files[0])return err("Add a photo of your ID and a selfie.");
    S.user.name=v("fn");S.user.idType=v("idt");S.user.idLast4=v("idn").slice(-4);
    const body={phone:S.user.phone,name:S.user.name,dob:v("dob"),idType:S.user.idType,idLast4:S.user.idLast4,address:v("adr")};
    $("#app").innerHTML=`<div class="card"><h2>Sending your details</h2><div class="hint">Please wait.</div></div>`;
    Promise.all([shrink($("#idp").files[0]),shrink($("#sf").files[0])])
      .then(([idImg,selfie])=>fetch("/api/kyc",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...body,idImg,selfie})}))
      .then(r=>{if(r.status===501)throw"demo";if(!r.ok)throw"fail";S.user.pending=true;saveUser();pollKyc()})
      .catch(e=>{if(e==="demo")return setTimeout(()=>{S.user.verified=true;saveUser();view()},2500);
        view();$("#err").textContent="Could not submit. Check your connection and photos, then try again."});
  };
}
fetch("/api/rates",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>fetch("rates.json",{cache:"no-store"}).then(r=>r.json())).then(j=>{S.rates=j}).catch(()=>{}).finally(view);

</script>
</body>
</html>
